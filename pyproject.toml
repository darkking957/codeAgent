[project]
name = "coreagent"
version = "0.1.0"
description = "Command-line AI assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.43.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
coreagent = "coreagent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
