[project]
name = "coreagent"
version = "0.1.0"
description = "Command-line AI assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.43.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pyyaml>=6.0",
    "pydantic>=2",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
# 双模式 Web 层（#0020）：仅 Web 入口需要；核心 CLI/TUI 不依赖，保持核心安装精简。
# 富渲染（#0024）：assistant 文本 Markdown→净化 HTML + 代码高亮，纯 Python、随服务端发出（不取 CDN）。
# 多用户/安全（#0025）：argon2-cffi（argon2id 密码哈希）+ psycopg（Postgres 同步驱动，部署后端）。
# 沙箱（bubblewrap）是**系统级**依赖（apt），不在此处（见 Dockerfile）。
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "markdown>=3.5",
    "pygments>=2.17",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.1",
]

[project.scripts]
coreagent = "coreagent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coreagent*"]

# 随包分发的 ripgrep 二进制（grep 工具依赖；本步仅 linux-x64）。
[tool.setuptools.package-data]
coreagent = ["bin/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# tui.py 的 ANSI/banner 排版含对齐用长行，放宽行宽限制。
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
